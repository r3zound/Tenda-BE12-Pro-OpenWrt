# ============================================================================
# 版本锁定 — 保证构建可复现
# ----------------------------------------------------------------------------
# 所有上游仓库都锁定到具体 commit，不使用分支名。
# 升级任一组件时：改这里 → 重新构建 → 验证 → 提交。
#
# 获取最新 SHA：
#   curl -sL "https://github.com/<owner>/<repo>/commits/<branch>.atom" \
#     | grep -oE '/commit/[0-9a-f]{40}' | head -1 | sed 's|/commit/||'
#
# 锁定时间：2026-10-02
# ============================================================================

# ---- OpenWrt 官方主线（基线）----------------------------------------------
OPENWRT_REPO=https://github.com/openwrt/openwrt.git
OPENWRT_BRANCH=main
OPENWRT_COMMIT=3f26ab3d4d973fdbd3a1593a68e8186f5cc58dbd

# ---- 官方 feeds ------------------------------------------------------------
# ⚠️ 硬性约束：OpenWrt 的 scripts/feeds 解析器用 (\w+) 匹配 feed 名，
#    即 **只接受 [A-Za-z0-9_]**，任何连字符都会导致
#    "Syntax error in feeds.conf, line N" 并以 exit 25 中止。
#    下方所有 FEED_NAME_* 必须为下划线命名，gen-feeds.sh 会强制校验。
#
#    另注：base-files 不是独立 feed —— 它就在 openwrt 主仓内
#    (package/base-files)，官方 feeds.conf.default 中亦无此项。
#    早期版本误加为独立 feed 导致构建失败，已移除。

LUCI_REPO=https://github.com/openwrt/luci.git
LUCI_BRANCH=master
LUCI_COMMIT=aa3d48836e90ae0706c8d8f9b46b8371e45cfe1f

PACKAGES_REPO=https://github.com/openwrt/packages.git
PACKAGES_BRANCH=master
PACKAGES_COMMIT=88019052fa25d86bfed3106edb3ba3022d8611c1

# ---- LuCI 主题（均非官方主线，需自行引入）---------------------------------
# ⚠️ 这三个包**不走 feeds**，由 scripts/fetch-extra-packages.sh 直接 clone
#    到 OpenWrt 的 package/ 目录。
#
# 原因：OpenWrt 的 include/scan.mk 用
#     find -L feeds/<名字> -mindepth 1 ... -name Makefile
# 扫描包，`-mindepth 1` 排除了 feed 根目录。而这三个仓库的 Makefile
# 恰好就在根目录（jerrykuku/luci-theme-argon、eamonxg/luci-theme-aurora
# 都是单包仓库），于是：
#     feeds install <名字>/<包名>  →  静默无输出、不报错、什么都不做
#     .config 里没有该包的符号    →  kconfig 不报错，编译全绿
#     固件里就是没有这个主题     →  事后翻 .config 才发现
# Run #5 就是这么白跑了一轮。详见 scripts/fetch-extra-packages.sh 头注释。
#
# PKG_NAME_* 即 clone 后的目录名，必须与仓库内的包名对得上。
PKG_NAME_THEME_ARGON=luci-theme-argon
THEME_ARGON_REPO=https://github.com/jerrykuku/luci-theme-argon.git
THEME_ARGON_BRANCH=master
THEME_ARGON_COMMIT=23c3e525578374d6b20f5e7b93d27874cd01a252

# argon 的配置界面（配色等），单独仓库
PKG_NAME_ARGON_CFG=luci-app-argon-config
ARGON_CFG_REPO=https://github.com/jerrykuku/luci-app-argon-config.git
ARGON_CFG_BRANCH=master
ARGON_CFG_COMMIT=3e099a37c3f71d0de677f1b6b0f4bffd57d91dac

PKG_NAME_THEME_AURORA=luci-theme-aurora
THEME_AURORA_REPO=https://github.com/eamonxg/luci-theme-aurora.git
THEME_AURORA_BRANCH=master
THEME_AURORA_COMMIT=84c27b66952e6fc4be60128067a6b88bfd34afb5


# ---- 应用 -----------------------------------------------------------------
# frpc：全部使用**官方**包，不再引入第三方 feed。
#
#   frpc         → openwrt/packages 官方（v0.71.0，Go 源码编译）
#                   注意：需要 golang host 构建依赖，会显著拉长构建时间
#   luci-app-frpc → openwrt/luci 官方 applications/luci-app-frpc
#                   含 htdocs/po/root，是完整 LuCI 应用，
#                   且其 LUCI_DEPENDS 已声明 "+frpc"
#
# 历史上曾用 kuoruan/luci-app-frpc（因为老的 luci-app-frp 仓库已 404），
# 但那个仓库同样是根 Makefile 结构，走 feeds 装不进来。
# Run #5 的日志证实 luci-app-frpc 实际来自官方 luci feed，功能不受影响，
# 故直接移除第三方源，减少一个变量。
# 锁定版本请看 LUCI_COMMIT / PACKAGES_COMMIT。

