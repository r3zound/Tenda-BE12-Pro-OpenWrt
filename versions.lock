# ============================================================================
# 版本锁定 — Tenda BE12 Pro / ImmortalWrt 25.12 分支
# -----------------------------------------------------------------------------
# ⚠️ 本文件属于 immortalwrt-25.12 分支，与 main 分支**不是同一套源**。
#    main 分支编 OpenWrt mainline SNAPSHOT（内核 6.18），那个分支才是日常用的。
#    切分支时别把两个 versions.lock 搞混。
#
# 为什么单独开一个分支编 ImmortalWrt：
#   main 走 OpenWrt SNAPSHOT，滚动更新、内核 6.18，固件里 LuCI 跑的是 master
#   （坑 11 的主题兼容性问题就是从这来的）。
#   这个分支走 ImmortalWrt openwrt-25.12 —— **固定稳定版、内核 6.12**，
#   软件源和插件生态都是国内调校过的，换来的是可复现 + 稳。
#
# 代价：ImmortalWrt 25.12 **没有这块板子**，需要自己移植（见下）。
# ============================================================================

# ---- 基线：ImmortalWrt 25.12 ------------------------------------------------
# 实测（2026-10-03）：filogic.mk 里 tenda_be12-pro 出现 **0 次**，
# 190 个 filogic 设备。但 MT7987 SoC 本身是支持的（bpi-r4-lite /
# mt7987a-rfb / routerich_be7200 等），所以缺的只是「这台机器的描述」。
OPENWRT_REPO=https://github.com/immortalwrt/immortalwrt.git
OPENWRT_BRANCH=openwrt-25.12
# ⚠️ 25.12 是稳定发布，**必须锁到具体 SHA**。锁到分支名的话上游一打 tag
#    你的构建内容就变了，故障无法复现。
OPENWRT_COMMIT=313718c25f206cdeee399bdc6c002b7388c9a513

# ---- feeds ------------------------------------------------------------------
# ⚠️ ImmortalWrt 用自己的 luci / packages 分支（openwrt-25.12），
#    **不能**混用 openwrt/luci master —— 那是给 SNAPSHOT 用的，API 不兼容。
#    这也是 main 分支和本分支最大的差异之一。
LUCI_REPO=https://github.com/immortalwrt/luci.git
LUCI_BRANCH=openwrt-25.12
LUCI_COMMIT=d6167ea0645cbd1327708d85f94824f42d0eb872

PACKAGES_REPO=https://github.com/immortalwrt/packages.git
PACKAGES_BRANCH=openwrt-25.12
PACKAGES_COMMIT=84bd86384928955b568988ca0e09e2c78c75173d

# ---- 板级移植（25.12 独有）------------------------------------------------
# 三件套，从 openwrt/openwrt main 抄过来，合计约 410 行：
#   1) patches/immortalwrt-25.12/mt7987a-tenda-be12-pro.dts   设备树 390 行
#   2) patches/immortalwrt-25.12/board-port.mk 里的 Build/tenda-mkdualimageheader
#      —— 原厂私有镜像头（"God1" 魔数 + gzip CRC），**没有它 bootloader 不认镜像**
#   3) 同文件里的 Device/tenda_be12-pro —— 14 行板子定义
# 由 scripts/apply-board-port.sh 在克隆源码后自动追加，幂等。
#
# ⚠️ 最大风险：ImmortalWrt 25.12 是 **内核 6.12**，主线是 6.18。
#    DTS 用到的较新 binding（airoha,an8855-ext-surge、MT76 的 band@0/band@1
#    节点写法）6.12 未必认。构建失败时先看 dtc 报的是哪个属性。
#
# ⚠️ 设备树作者是 X-Wrt 的 Developer X，板子 2026-03-09 之后才合入主线，
#    24.10 和 25.12.0~.3 全部没有。等官方把板子收进 ImmortalWrt 下一个稳定版，
#    就可以把整个 patches/ 目录删掉、改回直接选设备。

# ---- LuCI 主题 --------------------------------------------------------------
# 三个主题**都不走 feeds**，统一由 scripts/fetch-extra-packages.sh 挂到 package/。
# 原因：include/scan.mk 用 find -L feeds/<名字> -mindepth 1 -name Makefile 扫描，
# 而 jerrykuku/luci-theme-argon 和 eamonxg/luci-theme-aurora 的 Makefile 都在
# 仓库根目录，-mindepth 1 把它们排除了 → feeds 永远索引不到，
# 且**静默失败、不报错**：.config 里压根没有符号，编译一路绿灯，固件里没主题。
# （Run #5 栽在这个坑上。详见 scripts/fetch-extra-packages.sh 头部注释。）
#
# 注：ImmortalWrt 自己的 luci feed 里其实有 luci-theme-argon 和
# luci-theme-bootstrap（Makefile 在 themes/ 下，feeds 能扫到）。
# 这里仍走 package/ 挂载，是为了和 main 分支保持同一套代码、少一处差异。
PKG_NAME_THEME_ARGON=luci-theme-argon
THEME_ARGON_REPO=https://github.com/jerrykuku/luci-theme-argon.git
THEME_ARGON_BRANCH=master
THEME_ARGON_COMMIT=23c3e525578374d6b20f5e7b93d27874cd01a252

PKG_NAME_ARGON_CFG=luci-app-argon-config
ARGON_CFG_REPO=https://github.com/jerrykuku/luci-app-argon-config.git
ARGON_CFG_BRANCH=master
ARGON_CFG_COMMIT=3e099a37c3f71d0de677f1b6b0f4bffd57d91dac

# aurora（eamonxg）是第三方，**ImmortalWrt feeds 里没有**，必须外部挂载。
# ⚠️ 已知风险：锁的这个 commit 是给 **LuCI master**（SNAPSHOT）编的，
#    25.12 是稳定版、LuCI API 可能有出入，aurora 未必渲染得出来。
#    症状和坑 11 一样：主题装上了但界面花掉 / 下拉框空。
#    届时要么回退到 argon，要么把这里换成兼容 25.12 的 commit。
PKG_NAME_THEME_AURORA=luci-theme-aurora
THEME_AURORA_REPO=https://github.com/eamonxg/luci-theme-aurora.git
THEME_AURORA_BRANCH=master
THEME_AURORA_COMMIT=84c27b66952e6fc4be60128067a6b88bfd34afb5

# ============================================================================
# 自建 apk 源：代理面板
# -----------------------------------------------------------------------------
# 为什么需要自建源（这是整个项目最硬的理由）：
#   内核模块的 vermagic 绑死内核版本。SNAPSHOT 固件内核号天天变，
#   任何外部源给的 kmod 都是「上一版内核编的」，装上去必然失败。
#   实测别人的源给的是 kmod-nft-tproxy-6.18.52-r1，本机固件是 6.18.54。
#   自己用同一个 build root 编，ABI 天然 100% 匹配。
#
# 这些面板**不走 feeds**，全部由 scripts/fetch-proxy-packages.sh 挂到 package/。
# 原因：Makefile 都在仓库根目录，而 include/scan.mk 用
#   find -L feeds/<名字> -mindepth 1 -name Makefile 扫描，-mindepth 1 把根目录
#   排除了 → feeds 静默索引不到 → .config 里没有符号 → 编译全绿但固件里没面板。
#   本项目坑 1 和坑 5 都栽在同一个机制上。
#
# 格式：REPO_PROXY_<名字>=<package/ 下的目录名>|<git 地址>|<分支>
#   用竖线分隔：URL 里有斜杠但没有竖线。
#
# ⚠️ 单个仓库改名/删分支不会中断固件构建（脚本有意容错），
#    但会让对应面板从源里消失。每周构建的预编译阶段会打印失败清单。
#
# ⚠️⚠️ 实测（GitHub API 逐仓库查证，2026-10）：
#   **13 个仓库里 12 个的包 Makefile 不在根目录**，而在子目录：
#     openwrt-passwall  → luci-app-passwall/Makefile          深度 2
#     coolsnowwolf/luci → applications/<pkg>/Makefile         深度 3
#   OpenWrt 自己的扫描深度是 SCAN_DEPTH=5（include/toplevel.mk:106），
#   所以挂到 package/ 是能扫到的。**任何校验 Makefile 存在性的地方，
#   深度都必须 >= 5**，写成「只看根目录」会把 12/13 误判成坏的。
#
#   **package/ 下的目录名 ≠ OpenWrt 包名**：homeproxy 目录里 define 的是
#   luci-app-homeproxy。拿目录名去匹配 .apk 文件名永远匹配不到。
#   build-repo.sh 是运行时从 Makefile 里 grep 出真实包名的，不硬编码。
# ============================================================================

REPO_PROXY_PASSWALL=openwrt-passwall|https://github.com/Openwrt-Passwall/openwrt-passwall.git|main
REPO_PROXY_PASSWALL2=openwrt-passwall2|https://github.com/Openwrt-Passwall/openwrt-passwall2.git|main
REPO_PROXY_HOMEPROXY=homeproxy|https://github.com/immortalwrt/homeproxy.git|master
REPO_PROXY_NIKKIRS=OpenWrt-nikki-rs|https://github.com/CHKayanami/OpenWrt-nikki-rs.git|main
REPO_PROXY_CLASHRS=clash-rs|https://github.com/CHKayanami/clash-rs.git|master
REPO_PROXY_OPENCLASH=luci-app-openclash|https://github.com/vernesong/OpenClash.git|master
REPO_PROXY_MOSDNS=luci-app-mosdns|https://github.com/sbwml/luci-app-mosdns.git|v5
REPO_PROXY_MOMO=luci-app-momo|https://github.com/nikkinikki-org/OpenWrt-momo.git|main
REPO_PROXY_NEKOBOX=luci-app-nekobox|https://github.com/Thaolga/openwrt-nekobox.git|main
REPO_PROXY_HIJPASS=luci-app-hijpass|https://github.com/WROIATE/luci-app-hijpass.git|main
REPO_PROXY_XRAY=luci-app-xray|https://github.com/yichya/luci-app-xray.git|master
REPO_PROXY_FCHOMO=openwrt-fchomo|https://github.com/fcshark-org/openwrt-fchomo.git|master

