# =============================================================================
# Tenda BE12 Pro 固件构建 — GitHub Actions
# -----------------------------------------------------------------------------
# 触发方式：
#   1. Actions 页面 → Run workflow（手动）★ 默认就用这个
#   2. 推送 tag：git push origin v1.0.0
#   3. 每周一 03:17 UTC 跟随上游 SNAPSHOT 检查更新
#
# ⚠️ 2026-10-03 起**取消「推 main 自动构建」**。
#    原因：一次全量构建要 82~96 分钟，而实测里出现了纯文档提交
#    （2dc401d 只加了 AGENTS.md）白烧掉 96 分钟的情况。
#    现在改成：改完先推代码，攒够一批再手动触发一次构建。
#
# 产物：Actions Artifacts 中的固件 .bin 文件
# =============================================================================
name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '变体标识（写入 config.buildinfo）'
        required: false
        default: 'main'
      full_rebuild:
        description: '强制全新构建（忽略缓存）'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'
  schedule:
    # 每周一 03:17 UTC 跟随上游 SNAPSHOT 检查更新
    - cron: '17 3 * * 1'

env:
  OPENWRT_SRC: ${{ github.workspace }}/openwrt

jobs:
  build:
    name: Build (mediatek/filogic - tenda_be12-pro)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------------
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------------
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext \
            git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget bc \
            ecj fastjar java-propose-classpath \
            apparmor-utils apt-utils cmake ccache

      # ---------------------------------------------------------------------
      - name: 配置 ccache
        run: |
          ccache -M 5G
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "ccache 版本: $(ccache --version | head -1)"

      # ---------------------------------------------------------------------
      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      # ---------------------------------------------------------------------
      - name: 校验 versions.lock
        run: |
          echo "▸ 锁定的上游版本："
          grep -E '^[A-Z_]+_(REPO|BRANCH|COMMIT)=' versions.lock \
            | while IFS='=' read -r k v; do printf "  %-28s %s\n" "$k" "$v"; done

      # ---------------------------------------------------------------------
      - name: 生成 feeds.conf（锁定 commit）
        run: |
          chmod +x scripts/*.sh
          ./scripts/gen-feeds.sh "$OPENWRT_SRC"

      # ---------------------------------------------------------------------
      - name: 生成构建时间戳（北京时间）
        run: |
          # ⚠️ 必须排在「生成 feeds.conf」**之后** —— gen-feeds.sh 才把 OpenWrt
          #    源码树 clone 出来，而版本串里的 revision 来自树里的 scripts/getver.sh。
          #    Run #20 就因为排在前面，那会儿 $OPENWRT_SRC 还不存在，
          #    版本串变成了毫无信息量的 "unknown-20261004.0041"。
          #
          # ⚠️ 必须排在**所有**会用它的步骤之前，而且**全程只算一次**。
          #    版本串（CONFIG_VERSION_CODE）和 .bin 文件名后缀必须是同一个值，
          #    各算各的会出现「版本串写 00:31、文件名写 00:32」这种没法排查的错。
          #    经 GITHUB_ENV 传给后续所有步骤。
          vals="$(./scripts/build-stamp.sh "$OPENWRT_SRC")"
          echo "$vals"
          echo "$vals" >> "$GITHUB_ENV"
          # ⚠️⚠️ REVISION 必须一起导出 —— include/toplevel.mk:13 明确支持
          #    从环境注入 REVISION（源码注释说就是为了让递归 make 拿到它）。
          #    注入后 VERSION_CODE 会回退到它，/etc/openwrt_release 的
          #    DISTRIB_DESCRIPTION 才会带上我们的时间戳。
          #    ⚠️ 千万别改成往 .config 写 CONFIG_VERSION_CODE：那个符号在
          #    `if IMAGEOPT` 的不可见菜单块里，defconfig 会静默删掉（Run #20/#21）。
          echo "REVISION=$TENDA_BUILD_VERSION" >> "$GITHUB_ENV"
          # ⚠️ 上面是写到 GITHUB_ENV，**本步骤的 shell 里并没有这些变量** ——
          #    Run #20 里这行打出来是「LuCI 系统页会显示: OpenWrt SNAPSHOT 」（空的）。
          #    要在当前 shell 用，必须自己 eval 一遍。
          eval "$(echo "$vals" | sed 's/^\([A-Z_]*\)=\(.*\)$/export \1="\2"/')"
          echo "  LuCI 系统页会显示: OpenWrt SNAPSHOT $TENDA_BUILD_VERSION"
          echo "  .bin 文件名会变成: ...-squashfs-sysupgrade-$TENDA_BUILD_STAMP.bin"
          case "$TENDA_BUILD_REV" in
            r[0-9]*-[0-9a-f]*) echo "  ✅ revision 来自 getver.sh: $TENDA_BUILD_REV" ;;
            git-*)           echo "  ⚠️ 没能用上 getver.sh，退回短 hash: $TENDA_BUILD_REV" ;;
            *)               echo "  ❌ 拿不到任何 revision，版本串里不会有 hash" ;;
          esac

      # ---------------------------------------------------------------------
      - name: 板级移植 ⚠️
        run: |
          # ⛔ immortalwrt-25.12 分支专属。ImmortalWrt 25.12 官方**没有**
          #    Tenda BE12 Pro 这个板子（filogic.mk 里 0 次提及），
          #    不做这步的话 make menuconfig 里选不到设备，
          #    编译会一路绿灯但 bin/ 里根本没有固件。
          #
          # 补三件：设备树 DTS、Build/tenda-mkdualimageheader（原厂私有镜像头，
          # 没有它 bootloader 不认镜像）、Device/tenda_be12-pro（板子定义）。
          # 详见 patches/immortalwrt-25.12/board-port.mk 头部。
          #
          # 幂等，重复执行不会重复追加。
          ./scripts/apply-board-port.sh "$OPENWRT_SRC"

      # ---------------------------------------------------------------------
      - name: 板级移植回读校验 ⚠️
        run: |
          # 拷文件/追加文本都可能「成功但没生效」，这里从 make 视角复验一次：
          # 真正决定固件能不能出的，是 .config 里有没有这个设备的符号。
          cd "$OPENWRT_SRC"
          echo "--- filogic.mk 里的板级移植痕迹 ---"
          grep -n 'TENDA-PORT\|tenda-mkdualimageheader\|define Device/tenda_be12-pro\|TARGET_DEVICES += tenda_be12-pro' \
            target/linux/mediatek/image/filogic.mk | head -10
          echo "--- DTS 是否在位 ---"
          ls -l target/linux/mediatek/dts/mt7987a-tenda-be12-pro.dts
          echo "--- 设备在 filogic 的 profile 列表里吗 ---"
          grep -c '^TARGET_DEVICES' target/linux/mediatek/image/filogic.mk
          # 真实判据：make 能不能枚举出这个设备
          if grep -q 'define Device/tenda_be12-pro' target/linux/mediatek/image/filogic.mk; then
            echo "✅ 设备定义已注入"
          else
            echo "::error::板级移植失败：filogic.mk 里没有 Device/tenda_be12-pro"
            exit 1
          fi

      # ---------------------------------------------------------------------
      - name: 校验 feeds.conf 语法 ⚠️
        run: |
          # gen-feeds.sh 内部已做正则自检；这里再用 OpenWrt 真实解析器复验一次。
          # 历史教训：feed 名含连字符会导致 "Syntax error in feeds.conf" + exit 25。
          cd openwrt
          if perl ./scripts/feeds list >/dev/null 2>/tmp/feeds-err.txt; then
            echo "✅ feeds list 正常"
          fi
          if grep -qi 'syntax error' /tmp/feeds-err.txt 2>/dev/null; then
            echo "::error::feeds.conf 语法错误"
            cat /tmp/feeds-err.txt
            exit 1
          fi
          echo "✅ feeds.conf 通过官方解析器校验"
          echo "--- feed 列表 ---"
          grep '^src-' feeds.conf | awk '{print "  " $2}'

      # ---------------------------------------------------------------------
      - name: 拉取 feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          # ⚠️ 绝对不能省这一行。
          #    -a -p luci 只是把 luci feed 的包**放进 package/feeds/luci/**
          #    让 kconfig 能看见它们（173 个），并不代表都会进固件 ——
          #    真正进固件的只有 base.config 里写成 =y 的那些。
          #    省掉它会导致 luci / luci-base / csstidy / luasrcdiet 全部消失，
          #    连带 luci-theme-aurora、tenda-preset 报 "dependency does not exist"，
          #    最后 CONFIG_PACKAGE_luci 和 CONFIG_LUCI_LANG_zh_Hans 双双变没。
          #    教训：改 feed 安装步骤时，别用 build.sh 对照 —— 两边本来就可能不同步。
          ./scripts/feeds install -a -p luci
          # frp / luci-app-frpc 都用官方包（packages / luci feed 自带）
          ./scripts/feeds install frp/frpc
          # argon / aurora 主题由下一步挂到 package/，不走 feeds
          echo "── luci feed 装了多少包 ──"
          ls -1 package/feeds/luci 2>/dev/null | wc -l

      # ---------------------------------------------------------------------
      - name: 挂载第三方包到 package/
        run: |
          # ⚠️ 关键：这些仓库的 Makefile 在**根目录**，而 include/scan.mk 用
          #    `find -L feeds/<名字> -mindepth 1 -name Makefile` 扫描，
          #    根目录被排除 → feeds 静默索引不到 → .config 里没有符号 →
          #    编译全绿但固件里没有主题。Run #5 就踩了这个坑。
          #    绕开 feeds，直接 clone 到 package/（depth 1 正好能被扫到）。
          ./scripts/fetch-extra-packages.sh "$OPENWRT_SRC"
          echo "──── package/ 下的第三方包 ────"
          ls -1 "$OPENWRT_SRC/package" | grep -vE '^(feeds|README|index|config)' || true
          cat "$OPENWRT_SRC/package/.extra-packages"

      - name: 挂载预置配置包
        run: |
          # OpenWrt 没有 FILES_DIR 这种自定义 rootfs 注入机制，
          # 往镜像里塞文件的正规做法是做一个包。
          # ⚠️ 曾经"以为接上了"却什么也没做，Run #5 固件里预置文件全无，
          #    刷完是官方默认 192.168.1.1。详见 package/tenda-preset/Makefile。
          #
          # ⚠️ files/ 必须保留：Makefile 的 install 规则靠 $(CP) ./files/... 读它。
          #    这里曾有个 "rm -rf files" 的"优化"，会让 make 到 install 阶段才炸。
          cp -r package/tenda-preset "$OPENWRT_SRC/package/tenda-preset"
          echo "✅ tenda-preset 已挂载"
          find "$OPENWRT_SRC/package/tenda-preset" -type f | sed "s|.*tenda-preset|  ·|"

      # ---------------------------------------------------------------------
      - name: 生成 .config
        run: |
          ./scripts/gen-config.sh "$OPENWRT_SRC"
          echo "──── .config 摘要 ────"
          grep -E '^CONFIG_(TARGET_mediatek|PACKAGE_luci-theme|PACKAGE_frpc|LUCI_LANG)' \
            openwrt/.config | sort

      # ---------------------------------------------------------------------
      - name: 校验关键包已进 .config
        run: |
          # ⚠️ 必须在 make 之前拦住「符号压根不存在」的情况 ——
          #    kconfig 对未知符号既不报错也不警告，编译会一路绿灯通过，
          #    直到刷机后才发现主题不见了。
          cd "$OPENWRT_SRC"
          FAIL=0
          for p in luci luci-base luci-theme-bootstrap luci-theme-argon \
                   luci-theme-aurora luci-app-argon-config luci-app-frpc \
                   frpc tenda-preset; do
            if grep -qE "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  ✅ $p"
            else
              echo "  ❌ $p 未进入 .config（包没被发现，或 base.config 漏配）"
              FAIL=1
            fi
          done
          # 语言包是符号名，不叫 CONFIG_PACKAGE_*
          if grep -qE '^CONFIG_LUCI_LANG_zh_Hans=y' .config; then
            echo "  ✅ 简体中文"
          else
            echo "  ❌ CONFIG_LUCI_LANG_zh_Hans 未启用"
            FAIL=1
          fi
          for p in mwan3 passwall sing-box xray; do
            if grep -qE "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  ❌ $p 不该在镜像里，却进了 .config"
              FAIL=1
            else
              echo "  ✅ $p 已排除"
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "::error::关键包校验未通过"; exit 1; }
          echo "✅ 关键包校验通过"

      # ---------------------------------------------------------------------
      - name: 下载源码
        working-directory: openwrt
        run: make download -j$(nproc) V=s

      # ---------------------------------------------------------------------
      - name: 注入签名密钥 ⚠️
        id: repokey
        env:
          # ⚠️ 必须走 env，不能把 secret 直接插进 run 字符串 ——
          #    PEM 里出现引号/反斜杠会把 YAML 里的 shell 脚本截断。
          KEY: ${{ secrets.TENDO_REPO_PRIVATE_KEY }}
        run: |
          # 🔑 签名链路（全部实测自 OpenWrt 源码）：
          #    rules.mk:350   BUILD_KEY_APK_SEC = $(TOPDIR)/private-key.pem
          #    rules.mk:351   BUILD_KEY_APK_PUB = $(TOPDIR)/public-key.pem
          #    package/Makefile:91  没这两个文件就 **现场生成一把 EC 临时密钥**
          #    package/base-files:127  公钥自动进镜像 /etc/apk/keys/
          #
          # ⛔ 必须在 `make` 之前放好。索引签名和公钥进镜像都发生在 make 过程中，
          #    放晚了就来不及了 —— 而且临时私钥当场丢弃，下次构建老固件就不认新源了。
          if [ -z "$KEY" ]; then
            echo "::warning::未配置 secret TENDO_REPO_PRIVATE_KEY"
            echo "OpenWrt 会自动生成一次性 EC 密钥：固件能用，但**不自建源相关步骤全部跳过**"
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$KEY" > "$OPENWRT_SRC/private-key.pem"
          cp keys/public-key.pem "$OPENWRT_SRC/public-key.pem"
          chmod 600 "$OPENWRT_SRC/private-key.pem"

          # 回读校验：公钥必须和这把私钥是一对，否则设备永远验不过索引签名
          a=$(openssl pkey -in "$OPENWRT_SRC/private-key.pem" -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)
          b=$(openssl pkey -pubin -in "$OPENWRT_SRC/public-key.pem" -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [ -z "$a" ] || [ -z "$b" ] || [ "$a" != "$b" ]; then
            echo "::error::keys/public-key.pem 和 secret 里的私钥不是一对"
            exit 1
          fi
          echo "✅ 密钥对校验通过（pubkey sha256 ${b:0:16}…）"
          echo "have_key=true" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      - name: 编译固件
        working-directory: openwrt
        env:
          VARIANT: ${{ inputs.variant || 'main' }}
        run: |
          # frp 是 Go 包，构建耗时长，单独标记
          echo "▸ 预计耗时较长（frp 需要 Go 工具链）"
          # ⚠️⚠️ 必须取 make 自己的退出码，不能用 `make ... | tee ... || { exit 1; }`
          #    管道整体的退出码是**最后一个命令**（tee）的，tee 几乎永远返回 0，
          #    所以那个 || 分支永远不触发 —— make 崩了、没产出任何镜像，
          #    这一步照样显示 ✅ success。
          #    Run #22 就是这么被骗过去的：第 18 步「编译固件」绿灯，
          #    实际 artifact 里只有 8 个 BL2 preload，**一个 sysupgrade 镜像都没有**。
          #    是下一步 stamp-firmware.sh 的回读校验把它拦下来的。
          #    （同一个文件 371 行的体积守卫早就用了 PIPESTATUS，这里是不一致。）
          make -j$(nproc) V=s 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "::error::编译失败（make 退出码 $rc），末尾 100 行日志："
            tail -100 /tmp/build.log
            exit 1
          fi
          # 额外兜底：编译「成功」但没出镜像，是 Run #22 的真实故障模式，
          # 光看退出码不够 —— make 完全可能因为 incremental 而 no-op 成功。
          if ! ls -1 bin/targets/mediatek/filogic/*squashfs-sysupgrade*.bin >/dev/null 2>&1; then
            echo ""
            echo "::error::make 退出码为 0，但 bin/targets/mediatek/filogic 下没有任何 sysupgrade 镜像"
            ls -la bin/targets/mediatek/filogic/ || true
            exit 1
          fi
          echo "✅ 编译成功，sysupgrade 镜像已产出"

      # ---------------------------------------------------------------------
      - name: 固件文件名加时间戳 ⚠️
        run: |
          # ⚠️ 必须排在「生成校验和」「体积守卫」「内容抽查」**之前** ——
          #    这三个都按文件名找镜像，改名之后再算才对得上。
          #    这也是为什么 size-guard.sh / verify-firmware.sh 里
          #    原本写死的镜像名换成了 find_sysupgrade_bin（带不带时间戳都找得到）。
          ./scripts/stamp-firmware.sh "$OPENWRT_SRC" "$TENDA_BUILD_STAMP"

      # ---------------------------------------------------------------------
      - name: 记录构建信息
        run: |
          cd openwrt
          {
            echo "variant: ${{ inputs.variant || 'main' }}"
            echo "github_run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "built_at: $TENDA_BUILD_READABLE   # 北京时间 UTC+8"
            echo "built_at_utc: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "build_stamp: $TENDA_BUILD_STAMP"
            echo "version_code: $TENDA_BUILD_VERSION"
            echo "openwrt_revision: $TENDA_BUILD_REV"
            echo "runner: $(uname -srm)"
            echo "openwrt_commit: $(git rev-parse HEAD)"
            echo ""
            echo "=== feeds.conf ==="; cat feeds.conf
            echo ""
            echo "=== .config ==="; cat .config
          } > bin/targets/mediatek/filogic/config.buildinfo

      # ---------------------------------------------------------------------
      - name: 生成校验和
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          sha256sum *.bin > sha256sums
          cat sha256sums

      # ---------------------------------------------------------------------
      - name: 体积守卫 ⚠️
        run: |
          # 超过 rootfs 上限会失败，防止「编译通过但刷完变砖」
          ./scripts/size-guard.sh "$OPENWRT_SRC" "${{ inputs.variant || 'main' }}" \
            | tee /tmp/size-guard.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo ""
            echo "::error::体积超限，构建判定失败"
            exit 1
          fi

      # ---------------------------------------------------------------------
      - name: 固件内容抽查 ⚠️
        run: |
          # 编译成功 ≠ 内容正确。
          # Run #5 就是编译全绿、体积守卫也过，但预置配置文件一个都没进固件；
          # Run #5 的三个 LuCI 主题也全都没进。只有直接扫 squashfs 才抓得住。
          ./scripts/verify-firmware.sh "$OPENWRT_SRC"

      # =====================================================================
      # 自建 apk 源（r3zound/tenda-repo）
      # ---------------------------------------------------------------------
      # 全部条件在 have_key 上：没有稳定私钥就一步都不做。
      # 宁可这个星期的源还是上周的，也不能拿一次性密钥签一个设备永远认不了的索引。
      #
      # ⚠️ 这些步骤必须和固件构建在**同一个 job**里 —— 源的价值就在于
      #    「和固件同一次构建、同一个 build root 产出」，kmod vermagic 100% 匹配。
      #    拆成另一个 job 就得重编一遍，意义全无。
      # =====================================================================
      - name: 拉取面板仓库
        if: steps.repokey.outputs.have_key == 'true'
        run: |
          ./scripts/fetch-proxy-packages.sh "$OPENWRT_SRC"

      - name: 面板仓库就位校验 ⚠️
        if: steps.repokey.outputs.have_key == 'true'
        run: |
          # clone 返回 0 ≠ 包能被编。必须确认目录里有 Makefile，
          # 否则 .config 里压根没有这个符号，make 会一路绿灯。
          #
          # ⚠️ versions.lock 在**仓库根**，不在 openwrt/ 里 —— 先读清单再 cd，
          #    否则 grep 会安静地匹配不到任何东西，N=0 只因为路径错了。
          grep -E '^REPO_PROXY_[A-Z0-9_]+=' "$GITHUB_WORKSPACE/versions.lock" \
            | sed 's/^[^=]*=//' | cut -d'|' -f1 | grep -v '^$' > /tmp/panel-dirs.txt
          cd "$OPENWRT_SRC"
          N=0; BAD=0
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            N=$((N+1))
            # ⚠️ 不能只查 package/$d/Makefile：实测 13 个面板仓库里
            #    **12 个的包 Makefile 不在根目录**，而在子目录 ——
            #      openwrt-passwall/luci-app-passwall/Makefile
            #      coolsnowwolf/luci   → applications/<pkg>/Makefile（深度 3）
            #    OpenWrt 自己的扫描深度是 SCAN_DEPTH=5（include/toplevel.mk:106），
            #    这里必须跟着用同样的深度，否则会把 12/13 误判成坏的。
            if ! find "package/$d" -maxdepth 5 -name Makefile -type f -print -quit 2>/dev/null | grep -q .; then
              echo "  ❌ $d 深度 5 内没有 Makefile"
              BAD=$((BAD+1))
            fi
          done < /tmp/panel-dirs.txt
          echo "清单里有 $N 个面板仓库，其中 $BAD 个不可用"
          # 面板挂掉不阻断：固件已经编出来了，面板是加分项
          [ "$N" -gt 0 ] || { echo "::error::versions.lock 里一个 REPO_PROXY_* 都没有"; exit 1; }

      # ---------------------------------------------------------------------
      - name: 构建自建源
        if: steps.repokey.outputs.have_key == 'true'
        env:
          REPO_BRANCH: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || github.ref_name }}
        run: |
          ./scripts/build-repo.sh "$OPENWRT_SRC" ./apk-repo
          echo "──── 自建源摘要 ────"
          head -20 apk-repo/BUILD-INFO.txt

      - name: 上传自建源产物
        if: always() && steps.repokey.outputs.have_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-repo-${{ github.run_number }}
          path: |
            apk-repo/BUILD-INFO.txt
            apk-repo/packages.adb
            apk-repo/packages.adb.sig
          retention-days: 30
          if-no-files-found: warn

      - name: 发布自建源到 GitHub Pages
        if: steps.repokey.outputs.have_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_BRANCH: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || github.ref_name }}
        run: |
          # ⚠️ 校验不过就不推：build-repo.sh 失败时本步骤直接跳过，
          #    Pages 上保留上一版好内容。推一半会让设备拉到索引却下不到包，比不推更糟。
          [ -f apk-repo/packages.adb ] || { echo "::error::没有索引，拒绝发布"; exit 1; }
          ./scripts/publish-repo.sh ./apk-repo "$REPO_BRANCH" r3zound/tenda-repo

      # ---------------------------------------------------------------------
      - name: 上传 ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}

      # ---------------------------------------------------------------------
      - name: 上传固件产物
        # ⚠️ 必须 if: always()。
        #    之前校验类步骤一失败就跳过上传，导致「固件有问题但拿不到固件」，
        #    只能靠 69MB 的日志反推（还经常被下载截断）。失败时也上传，
        #    本地拿到就能随便验。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenda_be12-pro-${{ inputs.variant || 'main' }}-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
            openwrt/bin/targets/mediatek/filogic/packages/
          retention-days: 90
          if-no-files-found: error

      # ---------------------------------------------------------------------
      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            # ⚠️ 用通配符，不要写死文件名 ——
            #    stamp-firmware.sh 已经给镜像名加了 -YYYYMMDD.HHMM 后缀。
            #    写死的话 release 会传了个寂寞，而且「文件不存在」在
            #    action-gh-release 里不一定报得清楚。
            openwrt/bin/targets/mediatek/filogic/*squashfs-sysupgrade*.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
          body: |
            ## Tenda BE12 Pro 固件 ${{ github.ref_name }}

            **构建时间（北京时间）**：${{ env.TENDA_BUILD_READABLE }}
            **版本标识**：`${{ env.TENDA_BUILD_VERSION }}`
            **CI 运行**：[${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **上游 revision**：`${{ env.TENDA_BUILD_REV }}`

            **校验和**
            ```
            $(cat openwrt/bin/targets/mediatek/filogic/sha256sums)
            ```

            ### 刷机前必读
            1. 校验 SHA256：`sha256sum -c sha256sums`
            2. 确认型号为 **Tenda BE12 Pro（tenda_be12-pro）**
            3. 首次从原厂固件进入需**过渡固件**，见 README §7 阶段一
            4. 升级时**不要勾选「保留设置」**，见 README §7 阶段二
            5. ⚠️ 刷完必看 **README §8 救援流程**

            ### 安装 mwan3（每次升级后都需重装）
            ```sh
            sh /usr/lib/tenda/install-mwan3.sh
            ```
